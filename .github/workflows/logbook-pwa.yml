name: Logbook PWA

on:
  push:
    paths:
      - 'logbook-pwa/**'
      - '.github/workflows/logbook-pwa.yml'
  pull_request:
    paths:
      - 'logbook-pwa/**'
      - '.github/workflows/logbook-pwa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logbook-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: logbook-pwa/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-25.3.0
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run test:browser
      - run: npm run lint
      - run: npm run build
