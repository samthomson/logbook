name: Scheduled maintenance

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            logbook-pwa/package-lock.json
            scripts/package-lock.json
      - name: Install browser dependencies
        working-directory: logbook-pwa
        run: npm ci --no-audit --no-fund
      - name: Install worker dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Run complete verification
        run: ./tools/verify-all.sh
      - name: Record dependency drift
        if: always()
        run: |
          mkdir -p maintenance-report
          (cd logbook-pwa && npm outdated --json > ../maintenance-report/pwa-outdated.json) || true
          (cd scripts && npm outdated --json > ../maintenance-report/worker-outdated.json) || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: maintenance-report-${{ github.run_id }}
          path: maintenance-report/
          retention-days: 30
