name: Scheduled maintenance

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            logbook-pwa/package-lock.json
            scripts/package-lock.json
      - name: Install browser dependencies
        working-directory: logbook-pwa
        run: npm ci --no-audit --no-fund
      - name: Install worker dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Run complete verification
        run: ./tools/verify-all.sh
      - name: Record dependency drift
        if: always()
        run: |
          mkdir -p maintenance-report
          (cd logbook-pwa && npm outdated --json > ../maintenance-report/pwa-outdated.json) || true
          (cd scripts && npm outdated --json > ../maintenance-report/worker-outdated.json) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-report-${{ github.run_id }}
          path: maintenance-report/
          retention-days: 30
