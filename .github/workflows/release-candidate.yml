name: PWA release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'pwa-v*'

permissions:
  contents: read

concurrency:
  group: pwa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            logbook-pwa/package-lock.json
            scripts/package-lock.json
      - name: Install PWA dependencies
        working-directory: logbook-pwa
        run: npm ci --no-audit --no-fund
      - name: Install worker dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund
      - name: Verify release source
        run: ./tools/verify-all.sh
      - name: Create immutable release inventory
        run: |
          mkdir -p release-candidate
          cp -a logbook-pwa/dist release-candidate/dist
          find release-candidate/dist -type f -print0 | sort -z | xargs -0 sha256sum > release-candidate/SHA256SUMS
          git rev-parse HEAD > release-candidate/GIT_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: logbook-pwa-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

# Deliberately no production deployment job yet. The canonical Compass NIP-46
# signer is not available to a hosted runner, and this repository has no GitHub
# mirror/runner connection. Add a protected production environment only after
# the threat model and byte-verification path in docs/automation.md are met.
