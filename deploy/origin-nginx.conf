# Feed origin: worker writes /var/www/logbook, this serves LOGBOOK_BASE_URL.
# Same contract locally and on Dokploy; TLS stays on the host proxy.

server {
    listen 8080;
    server_name _;
    root /var/www/logbook;

    location = /feed.xml {
        types { application/rss+xml xml; }
        add_header Accept-Ranges bytes always;
        try_files /feed.xml =404;
    }

    location ~ ^/audio/[A-Za-z0-9][A-Za-z0-9._-]*\.mp3$ {
        types { audio/mpeg mp3; }
        add_header Accept-Ranges bytes always;
        try_files $uri =404;
    }

    location ~ ^/audio/[A-Za-z0-9][A-Za-z0-9._-]*-chapters\.json$ {
        types { application/json json; }
        add_header Accept-Ranges bytes always;
        try_files $uri =404;
    }

    # episodes.json, run metadata, and release ledgers are worker state.
    location / {
        return 404;
    }
}
