# Local PWA only. Not used by Dokploy.
#
#   docker compose -f compose.yml -f compose.dev.yml --profile dev up --build

services:
  pwa-dev:
    profiles: [dev]
    read_only: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: on-failure
    build:
      context: .
      dockerfile: logbook-pwa/Dockerfile
      target: deps
    user: "node"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      COMPASS_PUBKEY: ${COMPASS_PUBKEY}
      ADMIN_PUBKEYS: ${ADMIN_PUBKEYS}
      RELAYS: ${RELAYS}
      DISCOVERY_RELAYS: ${DISCOVERY_RELAYS}
      BLOSSOM_SERVERS: ${BLOSSOM_SERVERS}
    ports:
      - "${PWA_DEV_PORT}:5173"
    volumes:
      - ./logbook-pwa/src:/app/src
      - ./logbook-pwa/index.html:/app/index.html
      - ./logbook-pwa/vite.config.ts:/app/vite.config.ts
      - ./logbook-pwa/public:/app/public
      - ./logbook-pwa/pwa:/app/pwa
    tmpfs:
      - /tmp:mode=1777
      - /app/node_modules/.vite:mode=1777,uid=1000,gid=1000
      - /app/node_modules/.vite-temp:mode=1777,uid=1000,gid=1000

  pwa:
    profiles: [prod]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: on-failure
    build:
      context: .
      dockerfile: logbook-pwa/Dockerfile
      args:
        COMPASS_PUBKEY: ${COMPASS_PUBKEY}
        ADMIN_PUBKEYS: ${ADMIN_PUBKEYS}
        RELAYS: ${RELAYS}
        DISCOVERY_RELAYS: ${DISCOVERY_RELAYS}
        BLOSSOM_SERVERS: ${BLOSSOM_SERVERS}
    ports:
      - "${PWA_PORT}:8080"
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
