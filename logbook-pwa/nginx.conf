server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths resolve to the shell, matching the nsite
    # gateway fallback configured in .nsite/config.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NIP-05 lookups are cross-origin by definition.
    location = /.well-known/nostr.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # A stale worker or manifest pins clients to an old bundle, so revalidate
    # both on every load while hashed assets stay immutable.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Byte ranges are required for audio seeking.
    location /audio/ {
        add_header Accept-Ranges bytes always;
    }
}
